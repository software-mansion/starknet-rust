on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != 'master' }}

name: Tests
jobs:
  unix-test:
    name: Unix tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, nightly]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install hidapi dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev

      - name: Setup toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          profile: minimal
          override: true

      - name: Use Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Test starknet-rust-crypto with pedersen_no_lookup
        run: |
          cargo test -p starknet-rust-crypto --features pedersen_no_lookup

      - name: Test EthSigner with a deployed secp256k1 account
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        env:
          ETH_ACCOUNT_SIERRA: ${{ runner.temp }}/eth-account.sierra.json
        run: |
          curl --fail --silent --show-error --location --output "$ETH_ACCOUNT_SIERRA" \
            https://raw.githubusercontent.com/starknet-io/starknet.js/e5be57628d80b65e4499d58130d6112f1b606cb0/__mocks__/cairo/ethSigner/account_eth_oz_090.sierra.json
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/devnet.tar.gz" \
            https://github.com/starknet-io/starknet-devnet/releases/download/v0.7.2/starknet-devnet-x86_64-unknown-linux-musl.tar.gz
          echo "fbcc9aa0159619c29e3cca3a83f350640f60d960f43896ad1c569223a51de0fc  $RUNNER_TEMP/devnet.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/devnet.tar.gz" -C "$RUNNER_TEMP" starknet-devnet
          "$RUNNER_TEMP/starknet-devnet" --port 5190 --accounts 1 --seed 190 &
          devnet_pid=$!
          trap 'kill "$devnet_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:5190/is_alive
          cargo test --locked --features eth --test eth_account_devnet -- --ignored

      - name: Run cargo tests
        run: |
          cargo test --all

      - name: Run eth signer tests
        run: cargo test -p starknet-rust-signers --features eth --lib eth::tests

      - name: Run account signer compatibility test
        run: cargo test -p starknet-rust-signers --features eth --test account_signer_compatibility

      - name: Run eth account tests
        run: cargo test -p starknet-rust-accounts --features eth --lib encoded::tests

      - name: Test free RPC provider (zan)
        env:
          TEST_NODE_URL: "https://api.zan.top/public/starknet-sepolia/rpc/v0_10"
        run: |
          cargo test -p starknet-rust-providers jsonrpc_spec_version

  win-test:
    name: Windows tests
    runs-on: windows-latest
    strategy:
      matrix:
        toolchain: [stable, nightly]
        target: [x86_64-pc-windows-gnu, x86_64-pc-windows-msvc]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}
          profile: minimal
          override: true

      - name: Use Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Test starknet-rust-crypto with pedersen_no_lookup
        run: |
          cargo test -p starknet-rust-crypto --features pedersen_no_lookup

      - name: Run cargo tests
        run: |
          cargo test --all --target ${{ matrix.target }} --exclude starknet-rust-cxx

      - name: Run eth signer tests
        run: cargo test -p starknet-rust-signers --features eth --target ${{ matrix.target }} --lib eth::tests

      - name: Run account signer compatibility test
        run: cargo test -p starknet-rust-signers --features eth --target ${{ matrix.target }} --test account_signer_compatibility

      - name: Run eth account tests
        run: cargo test -p starknet-rust-accounts --features eth --target ${{ matrix.target }} --lib encoded::tests

  wasm-test:
    name: WASM tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Use Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Add wasm32-unknown-unknown target
        run: |
          rustup target add wasm32-unknown-unknown

      - name: Build project
        run: |
          cargo build --all --target wasm32-unknown-unknown \
            --exclude starknet-rust-cxx \
            --exclude starknet-rust-tokio-tungstenite

      - name: Install wasm-pack
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: wasm-pack

      - name: Run starknet-rust-crypto tests
        run: |
          (cd ./starknet-rust-crypto && wasm-pack test --release --node)

      - name: Run starknet-rust-core tests
        run: |
          (cd ./starknet-rust-core && wasm-pack test --release --node)

      - name: Run starknet-rust-signers tests
        run: |
          (cd ./starknet-rust-signers && wasm-pack test --release --node)

      - name: Run starknet-rust-macros tests
        run: |
          (cd ./starknet-rust-macros && wasm-pack test --release --node)

  no-std-build:
    name: no-std build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Use Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Add --target thumbv6m-none-eabi target
        run: |
          rustup target add thumbv6m-none-eabi

      - name: Build starknet-rust-crypto
        run: |
          cargo build --package starknet-rust-crypto \
            --target thumbv6m-none-eabi \
            --no-default-features

          cargo build --package starknet-rust-crypto \
            --target thumbv6m-none-eabi \
            --no-default-features \
            --features alloc

      - name: Build starknet-rust-core
        run: |
          cargo build --package starknet-rust-core \
            --target thumbv6m-none-eabi \
            --no-default-features

  ledger:
    name: Ledger tests
    runs-on: ubuntu-latest
    container: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:5.3.14

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install hidapi dependencies
        run: apt-get update && apt-get install --yes libudev-dev

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable

      - name: Use Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Clone app-starknet
        run: git clone --depth 1 --branch nanox_2.7.0_2.4.0_sdk_v26.0.2 https://github.com/LedgerHQ/app-starknet.git /tmp/app-starknet

      - name: Build Starknet Ledger App (Nano X)
        run: |
          cd /tmp/app-starknet/starknet
          # RUSTUP_TOOLCHAIN is set in the ledger-app-builder image
          cargo +${RUSTUP_TOOLCHAIN} ledger build nanox
          mkdir -p ${GITHUB_WORKSPACE}/starknet-rust-signers/test-data/ledger-app
          mkdir -p ${GITHUB_WORKSPACE}/starknet-rust-accounts/test-data/ledger-app
          cp target/nanox/release/starknet \
            ${GITHUB_WORKSPACE}/starknet-rust-signers/test-data/ledger-app/nanox.elf
          cp target/nanox/release/starknet \
            ${GITHUB_WORKSPACE}/starknet-rust-accounts/test-data/ledger-app/nanox.elf

      - name: Run starknet-rust-signers tests
        run: |
          cargo test --package starknet-rust-signers \
            ledger:: \
            -- --ignored

      - name: Run starknet-rust-accounts tests
        run: |
          cargo test --package starknet-rust-accounts \
            ledger:: \
            -- --ignored
